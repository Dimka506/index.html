<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Изометрическая комната подростка</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #1a1a2e; font-family: 'Segoe UI', sans-serif; }
  canvas { display: block; }
  #ui {
    position: absolute; top: 20px; left: 20px;
    background: rgba(20, 20, 40, 0.85);
    padding: 16px 20px; border-radius: 12px;
    color: #fff; backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }
  #ui h3 { margin-bottom: 10px; font-size: 14px; color: #ffcc66; letter-spacing: 1px; }
  .btn-group { display: flex; flex-direction: column; gap: 6px; }
  .btn {
    background: rgba(255,255,255,0.08);
    color: #fff; border: 1px solid rgba(255,255,255,0.15);
    padding: 8px 14px; border-radius: 6px; cursor: pointer;
    font-size: 13px; transition: all 0.2s;
    text-align: left;
  }
  .btn:hover { background: rgba(255,204,102,0.2); }
  .btn.active { background: #ffcc66; color: #1a1a2e; font-weight: 600; border-color: #ffcc66; }
  #hint {
    position: absolute; bottom: 20px; left: 20px;
    color: rgba(255,255,255,0.5); font-size: 12px;
  }
</style>
</head>
<body>
<div id="ui">
  <h3>🏠 ВИДИМОСТЬ КОМНАТЫ</h3>
  <div class="btn-group">
    <button class="btn active" data-mode="all">Все 4 стены</button>
    <button class="btn" data-mode="back">Только задняя стена</button>
    <button class="btn" data-mode="floor">Только пол</button>
  </div>
</div>
<div id="hint">🖱 ЛКМ — вращение · ПКМ — перемещение · Колесо — зум</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- Сцена ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);
scene.fog = new THREE.Fog(0x1a1a2e, 25, 60);

// ---------- Камера (изометрия) ----------
const frustumSize = 14;
const aspect = window.innerWidth / window.innerHeight;
const camera = new THREE.OrthographicCamera(
  -frustumSize * aspect / 2, frustumSize * aspect / 2,
  frustumSize / 2, -frustumSize / 2,
  0.1, 100
);
camera.position.set(10, 10, 10);
camera.lookAt(0, 0, 0);

// ---------- Рендерер ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// ---------- Управление ----------
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minZoom = 0.4;
controls.maxZoom = 3;
controls.maxPolarAngle = Math.PI / 2.1;

// ---------- Свет ----------
const ambient = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambient);

const dirLight = new THREE.DirectionalLight(0xfff0d6, 1.0);
dirLight.position.set(8, 15, 8);
dirLight.castShadow = true;
dirLight.shadow.mapSize.set(2048, 2048);
dirLight.shadow.camera.left = -12;
dirLight.shadow.camera.right = 12;
dirLight.shadow.camera.top = 12;
dirLight.shadow.camera.bottom = -12;
scene.add(dirLight);

const fillLight = new THREE.DirectionalLight(0x88aaff, 0.3);
fillLight.position.set(-8, 5, -5);
scene.add(fillLight);

const lampLight = new THREE.PointLight(0xffaa55, 1.0, 8, 2);
lampLight.position.set(-3.2, 3.2, -3.2);
scene.add(lampLight);

// ---------- Материалы ----------
const mat = {
  floor: new THREE.MeshStandardMaterial({ color: 0xe3d5c3, roughness: 0.6 }),
  wall: new THREE.MeshStandardMaterial({ color: 0xf7f3eb, roughness: 0.9 }),
  wallAccent: new THREE.MeshStandardMaterial({ color: 0xe8dfd3, roughness: 0.85 }),
  wood: new THREE.MeshStandardMaterial({ color: 0x6b4423, roughness: 0.7 }),
  woodLight: new THREE.MeshStandardMaterial({ color: 0xc4a484, roughness: 0.6 }),
  bed: new THREE.MeshStandardMaterial({ color: 0x4a5d8f, roughness: 0.9 }),
  pillow: new THREE.MeshStandardMaterial({ color: 0xf0e6d2, roughness: 0.9 }),
  blanket: new THREE.MeshStandardMaterial({ color: 0x2d3a5f, roughness: 0.95 }),
  metal: new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.4, metalness: 0.7 }),
  metalDark: new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.3, metalness: 0.8 }),
  screen: new THREE.MeshStandardMaterial({ color: 0x1a1a1a, emissive: 0x4488ff, emissiveIntensity: 0.6 }),
  chair: new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.6 }),
  rugBase: new THREE.MeshStandardMaterial({ color: 0x8b5a4a, roughness: 1.0 }),
  rugMid: new THREE.MeshStandardMaterial({ color: 0xc97b63, roughness: 1.0 }),
  rugTop: new THREE.MeshStandardMaterial({ color: 0xf0d8a8, roughness: 1.0 }),
  plant: new THREE.MeshStandardMaterial({ color: 0x3d7a3d, roughness: 0.8 }),
  pot: new THREE.MeshStandardMaterial({ color: 0xc47a5a, roughness: 0.9 }),
  guitarRed: new THREE.MeshStandardMaterial({ color: 0xc0392b, roughness: 0.5 }),
  shoe: new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5 }),
  shoeAccent: new THREE.MeshStandardMaterial({ color: 0xe74c3c, roughness: 0.5 }),
  lamp: new THREE.MeshStandardMaterial({ color: 0xffdd88, emissive: 0xffaa44, emissiveIntensity: 0.8 }),
  book: (c) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.8 }),
  trash: new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.6 }),
  ceiling: new THREE.MeshStandardMaterial({ color: 0xfdfcf8, roughness: 0.9 }),
  gold: new THREE.MeshStandardMaterial({ color: 0xffd700, roughness: 0.3, metalness: 0.8 }),
  rgb: new THREE.MeshStandardMaterial({ color: 0x111111, emissive: 0x00ff88, emissiveIntensity: 0.5 }),
  doorFrame: new THREE.MeshStandardMaterial({ color: 0x4a3728, roughness: 0.6 }),
  doorPanel: new THREE.MeshStandardMaterial({ color: 0x8b6f47, roughness: 0.7 }),
  bulb: new THREE.MeshStandardMaterial({ color: 0xffeebb, emissive: 0xffaa33, emissiveIntensity: 1.5 })
};

// ---------- Комната ----------
const roomSize = 8;
const wallHeight = 5;
const wallThickness = 0.15;

const floor = new THREE.Mesh(
  new THREE.BoxGeometry(roomSize, 0.2, roomSize),
  mat.floor
);
floor.position.y = -0.1;
floor.receiveShadow = true;
scene.add(floor);

const walls = {};

function makeWall(name, w, h, d, x, y, z, material = mat.wall) {
  const wall = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
  wall.position.set(x, y, z);
  wall.receiveShadow = true;
  wall.castShadow = true;
  walls[name] = wall;
  scene.add(wall);
  return wall;
}

makeWall('back', roomSize, wallHeight, wallThickness, 0, wallHeight/2, -roomSize/2, mat.wallAccent);
makeWall('left', wallThickness, wallHeight, roomSize, -roomSize/2, wallHeight/2, 0);
makeWall('right', wallThickness, wallHeight, roomSize, roomSize/2, wallHeight/2, 0);

// ---------- ПАНОРАМНОЕ ОКНО ----------
function makePanoramicWindow(name, x, y, z) {
  const group = new THREE.Group();
  const glass = new THREE.Mesh(
    new THREE.BoxGeometry(roomSize - 0.5, wallHeight - 0.5, 0.1),
    new THREE.MeshStandardMaterial({ color: 0x88ccff, transparent: true, opacity: 0.25, roughness: 0.05, metalness: 0.1, emissive: 0x4488ff, emissiveIntensity: 0.15 })
  );
  glass.position.set(0, wallHeight / 2, 0);
  group.add(glass);

  const frameMat = mat.metalDark;
  const topF = new THREE.Mesh(new THREE.BoxGeometry(roomSize, 0.2, 0.15), frameMat);
  topF.position.set(0, wallHeight - 0.1, 0);
  group.add(topF);
  
  const botF = new THREE.Mesh(new THREE.BoxGeometry(roomSize, 0.2, 0.15), frameMat);
  botF.position.set(0, 0.1, 0);
  group.add(botF);
  
  for (let i = -1; i <= 1; i++) {
    const vF = new THREE.Mesh(new THREE.BoxGeometry(0.12, wallHeight - 0.4, 0.15), frameMat);
    vF.position.set(i * (roomSize / 3), wallHeight / 2, 0);
    group.add(vF);
  }
  
  const hF = new THREE.Mesh(new THREE.BoxGeometry(roomSize, 0.12, 0.15), frameMat);
  hF.position.set(0, wallHeight * 0.65, 0);
  group.add(hF);

  group.position.set(x, y, z);
  walls[name] = group;
  scene.add(group);
  return group;
}
makePanoramicWindow('front', 0, 0, roomSize/2);

const ceiling = new THREE.Mesh(
  new THREE.BoxGeometry(roomSize, 0.1, roomSize),
  mat.ceiling
);
ceiling.position.y = wallHeight;
ceiling.receiveShadow = true;
scene.add(ceiling);

// ---------- ВХОДНАЯ ДВЕРЬ ----------
function makeDoor() {
  const doorGroup = new THREE.Group();
  const frame = new THREE.Mesh(new THREE.BoxGeometry(0.22, 2.3, 1.3), mat.doorFrame);
  frame.position.set(0, 1.15, 0);
  doorGroup.add(frame);
  
  const panel = new THREE.Mesh(new THREE.BoxGeometry(0.16, 2.1, 1.1), mat.doorPanel);
  panel.position.set(-0.02, 1.1, 0);
  doorGroup.add(panel);
  
  const filigreeTop = new THREE.Mesh(new THREE.BoxGeometry(0.17, 0.8, 0.9), mat.doorFrame);
  filigreeTop.position.set(-0.02, 1.55, 0);
  doorGroup.add(filigreeTop);
  
  const filigreeBot = new THREE.Mesh(new THREE.BoxGeometry(0.17, 0.8, 0.9), mat.doorFrame);
  filigreeBot.position.set(-0.02, 0.65, 0);
  doorGroup.add(filigreeBot);
  
  const knob = new THREE.Mesh(new THREE.SphereGeometry(0.06, 16, 16), mat.gold);
  knob.position.set(0.06, 1.1, 0.4);
  doorGroup.add(knob);
  
  const knobBase = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.15, 16), mat.gold);
  knobBase.rotation.x = Math.PI / 2;
  knobBase.position.set(0.04, 1.1, 0.4);
  doorGroup.add(knobBase);

  doorGroup.position.set(-3.9, 0, 1.0);
  return doorGroup;
}
scene.add(makeDoor());

// ---------- ЛЮСТРА (ровно под потолком) ----------
function makeChandelier() {
  const chand = new THREE.Group();
  
  // Потолочное крепление (y=0 относительно группы)
  const mount = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.1, 16), mat.gold);
  mount.position.y = 0;
  chand.add(mount);
  
  // Цепь / шнур (свисает вниз)
  const chain = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.8, 8), mat.metal);
  chain.position.y = -0.45;
  chand.add(chain);
  
  // Основное кольцо люстры
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.6, 0.06, 8, 32), mat.gold);
  ring.rotation.x = Math.PI / 2;
  ring.position.y = -0.9;
  chand.add(ring);
  
  // Центральная чаша
  const bowl = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.1, 0.2, 16), mat.gold);
  bowl.position.y = -0.9;
  chand.add(bowl);
  
  // Лампочки (4 штуки)
  const bulbGeo = new THREE.SphereGeometry(0.08, 16, 16);
  for(let i = 0; i < 4; i++) {
    const angle = (i / 4) * Math.PI * 2;
    const bulb = new THREE.Mesh(bulbGeo, mat.bulb);
    bulb.position.set(Math.cos(angle) * 0.6, -1.0, Math.sin(angle) * 0.6);
    chand.add(bulb);
    
    const socket = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.05, 0.1, 8), mat.metalDark);
    socket.position.set(Math.cos(angle) * 0.6, -0.85, Math.sin(angle) * 0.6);
    chand.add(socket);
  }
  
  // Тёплый точечный свет от люстры
  const warmLight = new THREE.PointLight(0xffaa55, 1.5, 15, 1.5);
  warmLight.position.y = -1.0;
  warmLight.castShadow = true;
  warmLight.shadow.bias = -0.001;
  chand.add(warmLight);
  
  // Позиция: ровно на уровне потолка (wallHeight = 5)
  chand.position.set(0, wallHeight, 0.5);
  return chand;
}
scene.add(makeChandelier());

// ---------- БОГАТЫЙ КОВЁР ----------
const rugGroup = new THREE.Group();
const rugBase = new THREE.Mesh(new THREE.BoxGeometry(4.8, 0.05, 3.8), mat.rugBase);
rugBase.position.set(0, 0.025, 0.5);
rugBase.receiveShadow = true;
rugGroup.add(rugBase);

const rugMid = new THREE.Mesh(new THREE.BoxGeometry(4.2, 0.06, 3.2), mat.rugMid);
rugMid.position.set(0, 0.03, 0.5);
rugGroup.add(rugMid);

const rugTop = new THREE.Mesh(new THREE.BoxGeometry(3.0, 0.07, 2.0), mat.rugTop);
rugTop.position.set(0, 0.035, 0.5);
rugGroup.add(rugTop);

const tasselMat = new THREE.MeshStandardMaterial({ color: 0xf0d8a8, roughness: 1 });
for(let i = 0; i < 12; i++) {
  const t = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.01, 0.15, 8), tasselMat);
  t.position.set(-2.1 + i * 0.38, 0.02, -1.35);
  rugGroup.add(t);
  const t2 = t.clone();
  t2.position.z = 2.35;
  rugGroup.add(t2);
}
scene.add(rugGroup);

// ---------- КРОВАТЬ ----------
function makeBed() {
  const bed = new THREE.Group();
  const base = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.4, 3.5), mat.woodLight);
  base.position.y = 0.2;
  base.castShadow = true;
  base.receiveShadow = true;
  bed.add(base);
  const mattress = new THREE.Mesh(new THREE.BoxGeometry(2, 0.3, 3.3), mat.bed);
  mattress.position.y = 0.55;
  mattress.castShadow = true;
  bed.add(mattress);
  const blanket = new THREE.Mesh(new THREE.BoxGeometry(2.05, 0.15, 2.2), mat.blanket);
  blanket.position.set(0, 0.78, 0.4);
  blanket.castShadow = true;
  bed.add(blanket);
  for (let i = -0.5; i <= 0.5; i += 1) {
    const pillow = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.2, 0.5), mat.pillow);
    pillow.position.set(i, 0.8, -1.3);
    pillow.castShadow = true;
    bed.add(pillow);
  }
  const headboard = new THREE.Mesh(new THREE.BoxGeometry(2.2, 1.2, 0.15), mat.wood);
  headboard.position.set(0, 0.9, -1.75);
  headboard.castShadow = true;
  bed.add(headboard);
  for (let x of [-1, 1]) {
    for (let z of [-1.6, 1.6]) {
      const leg = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.4, 0.15), mat.wood);
      leg.position.set(x, 0.2, z);
      bed.add(leg);
    }
  }
  return bed;
}
const bed = makeBed();
bed.position.set(-2.7, 0, -2);
scene.add(bed);

// ---------- БОГАТЫЙ СТОЛ ----------
function makeDesk() {
  const desk = new THREE.Group();
  const top = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.12, 1.4), mat.woodLight);
  top.position.y = 1.1;
  top.castShadow = true;
  top.receiveShadow = true;
  desk.add(top);
  
  const legGeo = new THREE.BoxGeometry(0.12, 1.1, 0.12);
  [[-1.3, -0.6], [-1.3, 0.6], [1.3, -0.6], [1.3, 0.6]].forEach(([x, z]) => {
    const leg = new THREE.Mesh(legGeo, mat.wood);
    leg.position.set(x, 0.55, z);
    leg.castShadow = true;
    desk.add(leg);
  });
  
  const drawer = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.3, 1.3), mat.wood);
  drawer.position.set(0.8, 0.85, 0);
  drawer.castShadow = true;
  desk.add(drawer);
  
  const ledStrip = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.05, 0.05), mat.rgb);
  ledStrip.position.set(0, 0.9, -0.65);
  desk.add(ledStrip);
  
  return desk;
}
const desk = makeDesk();
desk.position.set(2.6, 0, -3);
scene.add(desk);

// ---------- БОГАТЫЙ КОМПЬЮТЕР ----------
function makeComputer() {
  const pc = new THREE.Group();
  
  const monitor1 = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.7, 0.08), mat.metal);
  monitor1.position.set(-0.4, 1.75, 0);
  monitor1.castShadow = true;
  pc.add(monitor1);
  const screen1 = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.6, 0.02), mat.screen);
  screen1.position.set(-0.4, 1.75, 0.05);
  pc.add(screen1);
  
  const monitor2 = monitor1.clone();
  monitor2.position.set(0.8, 1.75, 0);
  pc.add(monitor2);
  const screen2 = screen1.clone();
  screen2.position.set(0.8, 1.75, 0.05);
  pc.add(screen2);
  
  const stand = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.4, 8), mat.metal);
  stand.position.set(-0.4, 1.3, 0);
  pc.add(stand);
  const stand2 = stand.clone();
  stand2.position.set(0.8, 1.3, 0);
  pc.add(stand2);
  
  const kb = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.04, 0.35), mat.rgb);
  kb.position.set(0.2, 1.17, 0.3);
  kb.castShadow = true;
  pc.add(kb);
  
  const mouse = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.05, 0.25), mat.metal);
  mouse.position.set(1.0, 1.17, 0.3);
  pc.add(mouse);
  
  const micPole = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.5, 8), mat.metal);
  micPole.position.set(-0.9, 1.35, 0.2);
  pc.add(micPole);
  const micHead = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.2, 16), mat.metal);
  micHead.position.set(-0.9, 1.6, 0.2);
  pc.add(micHead);
  
  const hpStand = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.08, 0.4, 8), mat.wood);
  hpStand.position.set(1.2, 1.3, 0.5);
  pc.add(hpStand);
  const hpBand = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.06, 0.12), mat.metal);
  hpBand.position.set(1.2, 1.55, 0.5);
  pc.add(hpBand);
  const hpEar1 = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.15, 0.1), new THREE.MeshStandardMaterial({color: 0x111111}));
  hpEar1.position.set(1.12, 1.48, 0.5);
  pc.add(hpEar1);
  const hpEar2 = hpEar1.clone();
  hpEar2.position.set(1.28, 1.48, 0.5);
  pc.add(hpEar2);
  
  const tower = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.9, 0.7), mat.metalDark);
  tower.position.set(-1.2, 1.55, 0);
  tower.castShadow = true;
  pc.add(tower);
  const led = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.3, 0.02),
    new THREE.MeshStandardMaterial({ color: 0x00ff88, emissive: 0x00ff88, emissiveIntensity: 1 }));
  led.position.set(-1.2, 1.6, 0.36);
  pc.add(led);
  
  return pc;
}
const computer = makeComputer();
computer.position.set(2.6, 0, -3.2);
scene.add(computer);

// ---------- СТУЛ ----------
function makeChair() {
  const chair = new THREE.Group();
  const seat = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.15, 0.8), mat.chair);
  seat.position.y = 0.8;
  seat.castShadow = true;
  chair.add(seat);
  const back = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.0, 0.12), mat.chair);
  back.position.set(0, 1.35, -0.35);
  back.castShadow = true;
  chair.add(back);
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.7), mat.metal);
  pole.position.set(0, 0.4, 0);
  chair.add(pole);
  for (let i = 0; i < 5; i++) {
    const arm = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.08, 0.08), mat.metal);
    arm.position.set(0, 0.05, 0);
    arm.rotation.y = (i / 5) * Math.PI * 2;
    chair.add(arm);
    const wheel = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 8), mat.metal);
    wheel.position.set(Math.sin(arm.rotation.y) * 0.3, 0.03, Math.cos(arm.rotation.y) * 0.3);
    chair.add(wheel);
  }
  return chair;
}
const chair = makeChair();
chair.position.set(2.6, 0, -1.8);
chair.rotation.y = Math.PI;
scene.add(chair);

// ---------- БОГАТЫЙ КНИЖНЫЙ ШКАФ (перемещён в передний левый угол) ----------
function makeBookshelf() {
  const shelf = new THREE.Group();
  const side1 = new THREE.Mesh(new THREE.BoxGeometry(0.12, 3.2, 0.8), mat.wood);
  side1.position.set(-0.7, 1.6, 0);
  side1.castShadow = true;
  shelf.add(side1);
  const side2 = side1.clone();
  side2.position.x = 0.7;
  shelf.add(side2);
  const top = new THREE.Mesh(new THREE.BoxGeometry(1.52, 0.12, 0.8), mat.wood);
  top.position.y = 3.2;
  shelf.add(top);
  
  for (let i = 0; i < 4; i++) {
    const p = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.06, 0.75), mat.wood);
    p.position.y = 0.8 + i * 0.8;
    p.receiveShadow = true;
    shelf.add(p);
  }
  
  const colors = [0xc0392b, 0x2980b9, 0x27ae60, 0xf39c12, 0x8e44ad, 0x16a085, 0xd35400, 0x2c3e50];
  for (let row = 0; row < 4; row++) {
    const y = 0.83 + row * 0.8;
    let x = -0.55;
    const numBooks = 5 + Math.floor(Math.random() * 4);
    for (let i = 0; i < numBooks; i++) {
      const w = 0.08 + Math.random() * 0.06;
      const h = 0.45 + Math.random() * 0.25;
      const book = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, 0.5),
        mat.book(colors[Math.floor(Math.random() * colors.length)])
      );
      book.position.set(x + w/2, y + h/2, 0);
      book.castShadow = true;
      shelf.add(book);
      x += w + 0.01;
      if (x > 0.5) break;
    }
  }
  
  const globe = new THREE.Mesh(new THREE.SphereGeometry(0.25, 16, 16), new THREE.MeshStandardMaterial({color: 0x4a90e2, roughness: 0.4, metalness: 0.3}));
  globe.position.set(0.3, 3.4, 0);
  globe.castShadow = true;
  shelf.add(globe);
  const globeStand = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.1, 0.2, 8), mat.gold);
  globeStand.position.set(0.3, 3.15, 0);
  shelf.add(globeStand);
  
  const hBook1 = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.12, 0.6), mat.book(0x8e44ad));
  hBook1.position.set(0.2, 0.86, 0.1);
  shelf.add(hBook1);
  const hBook2 = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.12, 0.55), mat.book(0x2980b9));
  hBook2.position.set(0.2, 0.92, 0.1);
  shelf.add(hBook2);

  return shelf;
}
const bookshelf = makeBookshelf();
// Перемещён в передний левый угол (дверь находится на Z=1.0, шкаф теперь на Z=3.2, чтобы не пересекаться)
bookshelf.position.set(-3.5, 0, 3.2);
scene.add(bookshelf);

// ---------- ГИТАРА ----------
function makeGuitar() {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.4, 16, 16), mat.guitarRed);
  body.scale.set(1, 1, 0.3);
  body.castShadow = true;
  g.add(body);
  const neck = new THREE.Mesh(new THREE.BoxGeometry(0.15, 1.2, 0.08), mat.wood);
  neck.position.set(0, 0.9, 0);
  neck.castShadow = true;
  g.add(neck);
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.3, 0.08), mat.wood);
  head.position.set(0, 1.6, 0);
  g.add(head);
  for (let i = -2; i <= 2; i++) {
    const string = new THREE.Mesh(
      new THREE.BoxGeometry(0.005, 1.5, 0.005),
      new THREE.MeshStandardMaterial({ color: 0xdddddd, metalness: 0.9 })
    );
    string.position.set(i * 0.02, 0.7, 0.05);
    g.add(string);
  }
  return g;
}
const guitar = makeGuitar();
guitar.position.set(3.5, 0.5, 2.5);
guitar.rotation.z = -0.2;
guitar.rotation.y = -0.5;
scene.add(guitar);

// ---------- РАСТЕНИЯ ----------
function makePlant() {
  const p = new THREE.Group();
  const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.2, 0.4, 16), mat.pot);
  pot.position.y = 0.2;
  pot.castShadow = true;
  p.add(pot);
  const soil = new THREE.Mesh(new THREE.CylinderGeometry(0.23, 0.23, 0.05, 16), new THREE.MeshStandardMaterial({ color: 0x3d2817, roughness: 1 }));
  soil.position.y = 0.4;
  p.add(soil);
  for (let i = 0; i < 8; i++) {
    const leaf = new THREE.Mesh(new THREE.SphereGeometry(0.2, 8, 8), mat.plant);
    leaf.scale.set(1, 0.5, 1);
    const angle = (i / 8) * Math.PI * 2;
    const r = 0.2;
    leaf.position.set(Math.cos(angle) * r, 0.6 + Math.random() * 0.3, Math.sin(angle) * r);
    leaf.castShadow = true;
    p.add(leaf);
  }
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.08, 0.5, 8), mat.plant);
  stem.position.y = 0.65;
  p.add(stem);
  return p;
}

const smallPlant = makePlant();
smallPlant.position.set(-2.7, 0, -1.2);
smallPlant.scale.set(0.55, 0.55, 0.55);
scene.add(smallPlant);

const bigPlant = makePlant();
bigPlant.position.set(3.5, 0, -3.2);
bigPlant.scale.set(1.2, 1.2, 1.2);
scene.add(bigPlant);

// ---------- НАСТОЛЬНАЯ ЛАМПА ----------
function makeDeskLamp() {
  const lamp = new THREE.Group();
  const base = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.25, 0.08, 16), mat.metal);
  base.position.y = 1.2;
  lamp.add(base);
  const arm1 = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.8, 8), mat.metal);
  arm1.position.set(0, 1.6, 0);
  arm1.rotation.z = 0.3;
  lamp.add(arm1);
  const arm2 = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.6, 8), mat.metal);
  arm2.position.set(0.2, 2.0, 0);
  arm2.rotation.z = -0.5;
  lamp.add(arm2);
  const shade = new THREE.Mesh(new THREE.ConeGeometry(0.25, 0.3, 16, 1, true), mat.lamp);
  shade.position.set(0.05, 2.15, 0);
  shade.rotation.z = 0.3;
  shade.rotation.x = Math.PI;
  lamp.add(shade);
  return lamp;
}
const deskLamp = makeDeskLamp();
deskLamp.position.set(3.5, 0, -3.2);
scene.add(deskLamp);

// ---------- КРОССОВКИ ----------
function makeSneaker(x, z, rotY) {
  const s = new THREE.Group();
  const sole = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.08, 0.6), mat.shoe);
  sole.position.y = 0.04;
  s.add(sole);
  const upper = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.15, 0.5), mat.shoeAccent);
  upper.position.set(0, 0.15, -0.03);
  s.add(upper);
  const toe = new THREE.Mesh(new THREE.SphereGeometry(0.11, 8, 8), mat.shoe);
  toe.scale.set(1, 0.7, 1.2);
  toe.position.set(0, 0.12, 0.25);
  s.add(toe);
  s.position.set(x, 0, z);
  s.rotation.y = rotY;
  return s;
}
scene.add(makeSneaker(0.5, 2.8, 0.2));
scene.add(makeSneaker(0.9, 2.9, -0.3));

// ---------- МУСОРКА ----------
const trash = new THREE.Mesh(
  new THREE.CylinderGeometry(0.25, 0.2, 0.5, 16, 1, true),
  mat.trash
);
trash.position.set(3.5, 0.25, -1.5);
trash.castShadow = true;
scene.add(trash);

// ---------- ЧАСЫ ----------
function makeClock() {
  const c = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 0.08, 32), mat.metal);
  body.rotation.x = Math.PI/2;
  c.add(body);
  const face = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.32, 0.02, 32), new THREE.MeshStandardMaterial({ color: 0xffffff }));
  face.rotation.x = Math.PI/2;
  face.position.z = 0.05;
  c.add(face);
  const hour = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.18, 0.01), mat.metal);
  hour.position.set(0, 0.09, 0.07);
  c.add(hour);
  const minute = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.25, 0.01), mat.metal);
  minute.position.set(0.05, 0.1, 0.07);
  minute.rotation.z = -Math.PI/3;
  c.add(minute);
  return c;
}
const clock = makeClock();
clock.position.set(3.92, 3.5, 0);
clock.rotation.y = -Math.PI/2;
scene.add(clock);

// ---------- ЗВЁЗДНОЕ НЕБО НА ПОТОЛКЕ ----------
const glowStars = new THREE.Mesh(
  new THREE.PlaneGeometry(2, 2),
  new THREE.MeshStandardMaterial({ color: 0x000033, emissive: 0xffff88, emissiveIntensity: 0.15 })
);
glowStars.rotation.x = Math.PI/2;
glowStars.position.set(-1, wallHeight - 0.05, -1);
scene.add(glowStars);

// ---------- UI ----------
const buttons = document.querySelectorAll('.btn');
function setMode(mode) {
  buttons.forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  walls.back.visible = (mode === 'all' || mode === 'back');
  walls.front.visible = (mode === 'all');
  walls.left.visible = (mode === 'all');
  walls.right.visible = (mode === 'all');
  ceiling.visible = (mode === 'all');
}
buttons.forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));

// ---------- Ресайз ----------
window.addEventListener('resize', () => {
  const a = window.innerWidth / window.innerHeight;
  camera.left = -frustumSize * a / 2;
  camera.right = frustumSize * a / 2;
  camera.top = frustumSize / 2;
  camera.bottom = -frustumSize / 2;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------- Анимация ----------
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  
  mat.screen.emissiveIntensity = 0.5 + Math.sin(Date.now() * 0.002) * 0.1;
  lampLight.intensity = 1.0 + Math.sin(Date.now() * 0.005) * 0.1;
  mat.rgb.emissiveIntensity = 0.4 + Math.sin(Date.now() * 0.003) * 0.2;
  
  renderer.render(scene, camera);
}
animate();
</script>
